# Default model per lane. Sourced by lanes/lane.sh and read (never written) by Cockpit.
# Empty = the CLI's own default. Override one run with LANE_MODEL=...
LANE_MODEL_CLAUDE=claude-sonnet-5-5
LANE_MODEL_CODEX=
# OpenCode Zen: free models need no key (see `opencode models opencode`).
LANE_MODEL_OPENCODE_ZEN=opencode/big-pickle
# OpenRouter: a cheap general model; change to taste (see `opencode models openrouter`).
LANE_MODEL_OPENROUTER=openrouter/~deepseek/deepseek-v4-flash-latest
# OpenAI API: not set up yet. After `opencode auth login` -> OpenAI, confirm the name with `opencode models openai`.
LANE_MODEL_OPENAI=openai/gpt-5.5
# Ollama: the private pipeline's model (also PRIVATE_MODEL in infra/env).
LANE_MODEL_OLLAMA=qwen3.8:27b
